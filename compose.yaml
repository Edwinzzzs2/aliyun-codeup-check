services:
  codeup-check:
    image: ${CODEUP_IMAGE:-ghcr.io/edwinzzzs2/aliyun-codeup-check:latest}
    container_name: aliyun-codeup-check
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      CODEUP_PROXY_URL: ${CODEUP_PROXY_URL:-}
      CODEUP_PROXY_TOKEN: ${CODEUP_PROXY_TOKEN:-}
      CODEUP_TOKEN: ${CODEUP_TOKEN:?CODEUP_TOKEN is required}
      CODEUP_ORG_ID: ${CODEUP_ORG_ID:?CODEUP_ORG_ID is required}
      CRON_SECRET: ${CRON_SECRET:-}
      YUNXIAO_OPENAPI_BASE_URL: ${YUNXIAO_OPENAPI_BASE_URL:-https://openapi-rdc.aliyuncs.com}
      ENABLE_INTERNAL_PIPELINE_SCHEDULER: "true"
